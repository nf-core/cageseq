# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "gtf2txdb"
description: Convert a GTF annotation file to a TxDb object stored as SQLite.
keywords:
  - GTF
  - TxDb
  - annotation
  - genomics
tools:
  - "txdbmaker":
      description: "A set of tools for making TxDb objects from genomic annotations from various sources (e.g. UCSC, Ensembl, and GFF files)."
      homepage: "https://www.bioconductor.org/packages/release/bioc/html/txdbmaker.html"
      documentation: "https://www.bioconductor.org/packages/release/bioc/vignettes/txdbmaker/inst/doc/txdbmaker.html"
      tool_dev_url: "https://github.com/Bioconductor/txdbmaker"
      doi: "10.18129/B9.bioc.txdbmaker"
      licence: ["Artistic-2.0"]

input:
  - - gtf:
        type: file
        description: GTF file containing genomic annotations to be converted into a TxDb object.
        pattern: "*.gtf"

output:
  txdb:
    - "*.sqlite":
        type: file
        description: A TxDb object serialised as an SQLite database, importable into R.
        pattern: "*.sqlite"
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - txdbmaker:
          type: string
          description: The name of the tool
      - 'Rscript -e ''cat(as.character(packageVersion("txdbmaker")))''':
          type: eval
          description: The expression to obtain the txdbmaker package version

authors:
  - "@sidorov-si"
maintainers:
  - "@sidorov-si"
