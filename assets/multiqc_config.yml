report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/cageseq/tree/dev" target="_blank">nf-core/cageseq</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/cageseq/dev/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-cageseq-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-cageseq-summary":
    order: -1002

export_plots: true

top_modules:
  - fastqc:
      name: "FastQC (raw)"
      info: "shows the quality metrics of raw reads."
      path_filters_exclude:
        - "*_val_*"
        - "*_trimmed_*"
  - fastqc:
      name: "FastQC (trimmed)"
      info: "shows the quality metrics of trimmed reads."
      path_filters:
        - "*_val_*"
        - "*_trimmed_*"
  - cutadapt:
      name: "Cutadapt"
      info: "is used here to trim 5'-G."
disable_version_detection: true
